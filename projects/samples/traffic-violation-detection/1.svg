<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" fill="#1b2430"/>
  <rect x="0" y="150" width="400" height="110" fill="#2b2f38"/>
  <rect x="0" y="150" width="400" height="6" fill="#f4c542"/>
  <g stroke="#f4c542" stroke-width="4" stroke-dasharray="18 14">
    <line x1="60" y1="205" x2="150" y2="205"/>
    <line x1="220" y1="205" x2="310" y2="205"/>
  </g>
  <!-- two wheeler -->
  <g transform="translate(150,150)">
    <circle cx="20" cy="70" r="22" fill="#0f1115" stroke="#9aa4b2" stroke-width="4"/>
    <circle cx="110" cy="70" r="22" fill="#0f1115" stroke="#9aa4b2" stroke-width="4"/>
    <path d="M20 70 L55 40 L85 40 L110 70" stroke="#d64545" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M55 40 L60 15 L75 15" stroke="#d64545" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="63" cy="10" r="10" fill="#e8b23a"/>
  </g>
  <!-- bounding box + detection overlay -->
  <rect x="128" y="70" width="150" height="115" fill="none" stroke="#39d98a" stroke-width="3"/>
  <rect x="128" y="55" width="98" height="20" fill="#39d98a"/>
  <text x="132" y="70" font-family="monospace" font-size="13" fill="#0f1115">NO HELMET 0.94</text>
  <!-- camera -->
  <g transform="translate(300,40)">
    <rect x="-10" y="0" width="70" height="34" rx="6" fill="#3d4654" stroke="#7fdcff" stroke-width="2"/>
    <circle cx="45" cy="17" r="10" fill="#7fdcff"/>
    <circle cx="45" cy="17" r="4" fill="#1b2430"/>
    <line x1="45" y1="17" x2="150" y2="130" stroke="#7fdcff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  </g>
  <text x="20" y="30" font-family="Poppins, sans-serif" font-size="20" fill="#e8ecf1" font-weight="600">YOLOv8 Violation Detection</text>
</svg>
