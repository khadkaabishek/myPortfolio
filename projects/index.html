<link href="./projects.css" rel="stylesheet"/>
<!-- NOTE: intentionally no ad script here — this is the main showcase page and stays ad-free. -->
<link href="../site-enhancements.css" rel="stylesheet"/>
<script type="application/ld+json">{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "Projects",
  "url": "https://www.abishek-khadka.com.np/projects/",
  "isPartOf": {
    "@type": "WebSite",
    "url": "https://www.abishek-khadka.com.np/"
  }
}</script></head>
<body>
<div class="projects-topbar">
<a class="projects-brand" href="../index.html"><i class="fas fa-code"></i> Abishek Khadka</a>
<div class="topbar-actions">
<a class="back-home" href="../index.html#contact"><i class="fas fa-arrow-left"></i> Back to Home</a>
<button class="theme-toggle-projects" id="themeToggleProjects"><i class="fas fa-sun"></i></button>
</div>
</div>
<div class="showcase-hero">
<h1>Projects</h1>
<p>A collection of things I've built — spanning computer vision, embedded robotics, full-stack platforms, and web development. Click any project for the full write-up, GitHub link, and a quick demo.</p>
</div>
<div class="showcase-grid" id="showcaseGrid"></div>
<script src="./projects-data.js"></script>
<script>
    const grid = document.getElementById("showcaseGrid");
    grid.innerHTML = PROJECTS.map(p => `
      <a class="showcase-card" href="./project.html?p=${encodeURIComponent(p.id)}">
        <div class="thumb-wrap"><img src="${p.thumbnail}" alt="${p.title}" loading="lazy" /></div>
        <div class="card-body">
          <h3>${p.title}</h3>
          <p>${p.tagline}</p>
          <div class="card-tags">${p.tech.slice(0,3).map(t => `<span class="tag">${t}</span>`).join("")}</div>
          <div class="card-cta">View details &amp; demo <i class="fas fa-arrow-right"></i></div>
        </div>
      </a>
    `).join("");

    // Theme toggle (persisted, synced with dark-mode used on main site)
    const toggle = document.getElementById("themeToggleProjects");
    const icon = toggle.querySelector("i");
    function applyTheme(dark) {
      document.body.classList.toggle("dark-mode", dark);
      icon.className = dark ? "fas fa-moon" : "fas fa-sun";
    }
    applyTheme(localStorage.getItem("theme") !== "light");
    toggle.addEventListener("click", () => {
      const dark = !document.body.classList.contains("dark-mode");
      applyTheme(dark);
      localStorage.setItem("theme", dark ? "dark" : "light");
    });
  </script>
<script src="../cursor.js"></script>
<script src="../page-transitions.js"></script>
</body>
</html>
