<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSON Formatter &amp; Validator | Abishek Khadka</title>
<meta name="description" content="Pretty-print, minify, and validate JSON with clear error messages. Runs entirely in your browser." />
<link rel="icon" type="image/png" href="../../Assets/letter-a.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tools-page">
  <div class="content-topbar">
    <a href="../../index.html" class="content-brand"><i class="fas fa-code"></i> Abishek Khadka</a>
    <div class="content-topbar-actions">
      <a href="../../Useful_tools.html" class="content-back"><i class="fas fa-arrow-left"></i> All Tools</a>
      <button id="themeToggleContent" class="content-theme-toggle"><i class="fas fa-sun"></i></button>
    </div>
  </div>

  <div class="tool-shell">
    <div class="tool-eyebrow">Developer Tools</div>
    <h1>JSON Formatter &amp; Validator</h1>
    <p class="tool-dek">Paste in JSON to pretty-print it, minify it, or check whether it's valid — with a clear error message pointing at the problem.</p>

    <div class="privacy-note"><i class="fas fa-lock"></i> Your JSON is processed locally in your browser and never sent anywhere.</div>

    <div class="tool-panel">
      <div class="form-row">
        <label for="jsonInput">Input JSON</label>
        <textarea id="jsonInput" style="min-height:220px;" placeholder='{"name": "Abishek", "skills": ["IoT", "Robotics", "Full-Stack"]}'></textarea>
      </div>

      <div class="form-row-inline">
        <div class="form-row" style="max-width:160px;">
          <label for="indentSize">Indent size</label>
          <select id="indentSize">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="formatBtn"><i class="fas fa-align-left"></i> Pretty-print</button>
        <button class="btn secondary" id="minifyBtn"><i class="fas fa-compress-alt"></i> Minify</button>
        <button class="btn secondary" id="validateBtn"><i class="fas fa-check-circle"></i> Validate</button>
        <button class="btn secondary" id="copyBtn"><i class="fas fa-copy"></i> Copy Output</button>
      </div>

      <p class="note" id="statusMsg"></p>

      <div class="form-row" style="margin-top:14px;">
        <label for="jsonOutput">Output</label>
        <textarea id="jsonOutput" style="min-height:220px;" readonly placeholder="Result will appear here…"></textarea>
      </div>
    </div>
  </div>

  <script>
    const jsonInput = document.getElementById('jsonInput');
    const jsonOutput = document.getElementById('jsonOutput');
    const indentSize = document.getElementById('indentSize');
    const formatBtn = document.getElementById('formatBtn');
    const minifyBtn = document.getElementById('minifyBtn');
    const validateBtn = document.getElementById('validateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusMsg = document.getElementById('statusMsg');

    function getIndent() {
      const v = indentSize.value;
      return v === 'tab' ? '\t' : parseInt(v, 10);
    }

    function findErrorLine(text, message) {
      // Try to extract a position from V8-style error messages, e.g. "at position 42"
      const match = message.match(/position (\d+)/);
      if (!match) return null;
      const pos = parseInt(match[1], 10);
      const upToError = text.slice(0, pos);
      const line = upToError.split('\n').length;
      const col = pos - upToError.lastIndexOf('\n');
      return { line, col };
    }

    function parseOrThrow() {
      const text = jsonInput.value;
      if (!text.trim()) throw new Error('Input is empty.');
      return JSON.parse(text);
    }

    formatBtn.addEventListener('click', () => {
      try {
        const parsed = parseOrThrow();
        jsonOutput.value = JSON.stringify(parsed, null, getIndent());
        statusMsg.textContent = '✓ Valid JSON — pretty-printed below.';
        statusMsg.style.color = '#2a9d8f';
      } catch (err) {
        const loc = findErrorLine(jsonInput.value, err.message);
        statusMsg.textContent = '✗ Invalid JSON: ' + err.message + (loc ? ` (near line ${loc.line}, column ${loc.col})` : '');
        statusMsg.style.color = '#c0392b';
        jsonOutput.value = '';
      }
    });

    minifyBtn.addEventListener('click', () => {
      try {
        const parsed = parseOrThrow();
        jsonOutput.value = JSON.stringify(parsed);
        statusMsg.textContent = '✓ Valid JSON — minified below.';
        statusMsg.style.color = '#2a9d8f';
      } catch (err) {
        const loc = findErrorLine(jsonInput.value, err.message);
        statusMsg.textContent = '✗ Invalid JSON: ' + err.message + (loc ? ` (near line ${loc.line}, column ${loc.col})` : '');
        statusMsg.style.color = '#c0392b';
        jsonOutput.value = '';
      }
    });

    validateBtn.addEventListener('click', () => {
      try {
        parseOrThrow();
        statusMsg.textContent = '✓ This is valid JSON.';
        statusMsg.style.color = '#2a9d8f';
      } catch (err) {
        const loc = findErrorLine(jsonInput.value, err.message);
        statusMsg.textContent = '✗ Invalid JSON: ' + err.message + (loc ? ` (near line ${loc.line}, column ${loc.col})` : '');
        statusMsg.style.color = '#c0392b';
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (!jsonOutput.value) return;
      try {
        await navigator.clipboard.writeText(jsonOutput.value);
        statusMsg.textContent = 'Copied to clipboard.';
        statusMsg.style.color = '#2a9d8f';
      } catch {
        jsonOutput.select();
        document.execCommand('copy');
      }
    });

    const toggle = document.getElementById("themeToggleContent");
    const icon = toggle.querySelector("i");
    function applyTheme(dark) {
      document.body.classList.toggle("dark-mode", dark);
      icon.className = dark ? "fas fa-moon" : "fas fa-sun";
    }
    applyTheme(localStorage.getItem("theme") === "dark");
    toggle.addEventListener("click", () => {
      const dark = !document.body.classList.contains("dark-mode");
      applyTheme(dark);
      localStorage.setItem("theme", dark ? "dark" : "light");
    });
  </script>
</body>
</html>
