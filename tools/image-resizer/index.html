<body class="tools-page">
<div class="content-topbar">
<a class="content-brand" href="../../index.html"><i class="fas fa-code"></i> Abishek Khadka</a>
<div class="content-topbar-actions">
<a class="content-back" href="../../Useful_tools.html"><i class="fas fa-arrow-left"></i> All Tools</a>

</div>

<div class="tool-shell">
<div class="tool-eyebrow">Image Tools</div>
<h1>Image Resizer</h1>
<p class="tool-dek">Resize an image to exact pixel dimensions or by percentage, with an option to lock the aspect ratio so nothing gets stretched.</p>
<div class="privacy-note"><i class="fas fa-lock"></i> Your image never leaves this device — everything is processed locally in your browser.</div>
<div class="tool-panel">
<label class="dropzone" id="dropzone">
<i class="fas fa-cloud-upload-alt dz-icon"></i>
<div><strong>Click to choose an image</strong> or drag and drop it here</div>
<input accept="image/png,image/jpeg,image/webp" id="fileInput" type="file"/>
</label>
<div id="controls" style="display:none; margin-top:22px;">
<div class="form-row">
<label>Resize mode</label>
<select id="mode">
<option value="pixels">Exact dimensions (px)</option>
<option value="percent">Percentage of original</option>
</select>
</div>
<div class="form-row-inline" id="pixelFields">
<div class="form-row">
<label for="widthInput">Width (px)</label>
<input id="widthInput" min="1" type="number"/>
</div>
<div class="form-row">
<label for="heightInput">Height (px)</label>
<input id="heightInput" min="1" type="number"/>
</div>
</div>
<div class="form-row" id="percentFields" style="display:none;">
<label for="percentInput">Percentage: <span id="percentValue">100</span>%</label>
<input id="percentInput" max="200" min="1" type="range" value="100"/>
</div>
<div class="form-row">
<label style="display:flex; align-items:center; gap:8px; font-weight:500;">
<input checked="" id="lockAspect" style="width:auto;" type="checkbox"/> Lock aspect ratio
          </label>
</div>
<div class="btn-row">
<button class="btn" id="resizeBtn"><i class="fas fa-expand"></i> Resize</button>
<a class="btn secondary" download="resized-image.png" id="downloadBtn" style="display:none;"><i class="fas fa-download"></i> Download</a>
</div>
</div>
<div class="result-box" id="resultBox" style="display:none;">
<img alt="Resized preview" class="preview-img" id="previewImg"/>
<div class="stat-row">
<div class="stat-box"><span class="num" id="origDims">–</span><span class="label">Original</span></div>
<div class="stat-box"><span class="num" id="newDims">–</span><span class="label">New size</span></div>
</div>
</div>
</div>
</div>
<canvas id="workCanvas" style="display:none;"></canvas>
<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const controls = document.getElementById('controls');
    const mode = document.getElementById('mode');
    const pixelFields = document.getElementById('pixelFields');
    const percentFields = document.getElementById('percentFields');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const percentInput = document.getElementById('percentInput');
    const percentValue = document.getElementById('percentValue');
    const lockAspect = document.getElementById('lockAspect');
    const resizeBtn = document.getElementById('resizeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resultBox = document.getElementById('resultBox');
    const previewImg = document.getElementById('previewImg');
    const origDimsEl = document.getElementById('origDims');
    const newDimsEl = document.getElementById('newDims');
    const canvas = document.getElementById('workCanvas');
    const ctx = canvas.getContext('2d');

    let currentImage = null;
    let aspectRatio = 1;
    let updatingFromCode = false;

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          aspectRatio = img.naturalWidth / img.naturalHeight;
          widthInput.value = img.naturalWidth;
          heightInput.value = img.naturalHeight;
          controls.style.display = 'block';
          resultBox.style.display = 'none';
          downloadBtn.style.display = 'none';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    dropzone.addEventListener('click', (e) => { if (e.target !== fileInput) fileInput.click(); });
    fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      loadFile(e.dataTransfer.files[0]);
    });

    mode.addEventListener('change', () => {
      const isPixels = mode.value === 'pixels';
      pixelFields.style.display = isPixels ? 'flex' : 'none';
      percentFields.style.display = isPixels ? 'none' : 'block';
    });

    percentInput.addEventListener('input', () => { percentValue.textContent = percentInput.value; });

    widthInput.addEventListener('input', () => {
      if (updatingFromCode || !lockAspect.checked) return;
      updatingFromCode = true;
      heightInput.value = Math.round(widthInput.value / aspectRatio);
      updatingFromCode = false;
    });
    heightInput.addEventListener('input', () => {
      if (updatingFromCode || !lockAspect.checked) return;
      updatingFromCode = true;
      widthInput.value = Math.round(heightInput.value * aspectRatio);
      updatingFromCode = false;
    });

    resizeBtn.addEventListener('click', () => {
      if (!currentImage) return;
      let targetW, targetH;
      if (mode.value === 'pixels') {
        targetW = parseInt(widthInput.value, 10);
        targetH = parseInt(heightInput.value, 10);
      } else {
        const pct = parseInt(percentInput.value, 10) / 100;
        targetW = Math.round(currentImage.naturalWidth * pct);
        targetH = Math.round(currentImage.naturalHeight * pct);
      }
      if (!targetW || !targetH || targetW < 1 || targetH < 1) return;

      canvas.width = targetW;
      canvas.height = targetH;
      ctx.clearRect(0, 0, targetW, targetH);
      ctx.drawImage(currentImage, 0, 0, targetW, targetH);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        previewImg.src = url;
        resultBox.style.display = 'block';
        origDimsEl.textContent = currentImage.naturalWidth + '×' + currentImage.naturalHeight;
        newDimsEl.textContent = targetW + '×' + targetH;
        downloadBtn.href = url;
        downloadBtn.style.display = 'inline-flex';
      }, 'image/png');
    });

    const toggle = document.getElementById("themeToggleContent");
    const icon = toggle.querySelector("i");
    function applyTheme(dark) {
      document.body.classList.toggle("dark-mode", dark);
      icon.className = dark ? "fas fa-moon" : "fas fa-sun";
    }
    applyTheme(localStorage.getItem("theme") !== "light");
    toggle.addEventListener("click", () => {
      const dark = !document.body.classList.contains("dark-mode");
      applyTheme(dark);
      localStorage.setItem("theme", dark ? "dark" : "light");
    });
  </script>
<script src="../../cursor.js"></script>
<script src="../../page-transitions.js"></script>
</body>
