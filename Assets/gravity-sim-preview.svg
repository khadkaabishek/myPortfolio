<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" fill="#0f1420"/>
  <!-- grid -->
  <g stroke="#1e2636" stroke-width="1">
    <line x1="0" y1="65" x2="400" y2="65"/>
    <line x1="0" y1="130" x2="400" y2="130"/>
    <line x1="0" y1="195" x2="400" y2="195"/>
    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
  </g>
  <!-- ground -->
  <rect x="0" y="225" width="400" height="35" fill="#1a2130"/>
  <!-- trajectory path (parabola) -->
  <path d="M40 225 Q 140 40 240 225" fill="none" stroke="#6c63ff" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.85"/>
  <!-- trajectory dots -->
  <g fill="#31b7c2">
    <circle cx="60" cy="185" r="3"/>
    <circle cx="85" cy="130" r="3"/>
    <circle cx="115" cy="90" r="3"/>
    <circle cx="145" cy="65" r="3"/>
    <circle cx="175" cy="90" r="3"/>
    <circle cx="205" cy="130" r="3"/>
    <circle cx="225" cy="185" r="3"/>
  </g>
  <!-- ball -->
  <circle cx="145" cy="65" r="12" fill="#f4a261"/>
  <circle cx="141" cy="61" r="4" fill="#ffe3c2" opacity="0.7"/>
  <!-- launch point -->
  <circle cx="40" cy="225" r="5" fill="#39d98a"/>
  <!-- vector arrow -->
  <line x1="40" y1="225" x2="75" y2="175" stroke="#39d98a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#39d98a"/>
    </marker>
  </defs>
  <text x="20" y="30" font-family="Poppins, sans-serif" font-size="18" fill="#e8ecf1" font-weight="600">Gravity Ball — Trajectory Sim</text>
</svg>
